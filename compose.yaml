services:
  softcove:
    build: .
    restart: unless-stopped
    env_file:
      - ${SOFTCOVE_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: "3100"
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:${SOFTCOVE_HTTP_PORT:-3100}:3100"
    volumes:
      - softcove_storage:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  softcove_storage:
